
<script id="engine">
/*ENGINE*/
</script>
<script>
const D = /*DATA*/;
const BT = /*BACKTEST*/;
const SNAP = /*SNAP*/;
const SNAP_PREV = /*SNAPPREV*/; // Sep 26 10-day baseline, kept for the Worlds comparison
const INIT = /*INIT*/;
const PATCH = /*PATCH*/;
const MSI = /*MSI*/;
const ROLL = /*ROLL*/;
const PADJ = /*PADJ*/;
const CAL = /*CAL*/;
const ROLES = /*ROLES*/;
const ROLEX = /*ROLEX*/;
(function(){
  const P = prepGames(D);
  const name = c => D.C[c];
  const pct = (x, d=1) => (x*100).toFixed(d);
  const $ = id => document.getElementById(id);
  const DEF = { lgs:[0,1,2,3,4,5], st:'all', pt:'all', half:5, pmult:1, tab:'rankings', sort:'take', dir:-1, heatSort:'all', role:'all',
    lab:{ useDepth:false, useShrink:true, useTeam:false, useRecency:true, usePressure:true, topN:20, k:10, sort:'mix', dir:-1 } };
  const state = JSON.parse(JSON.stringify(DEF));
  try { const s = JSON.parse(localStorage.getItem('fdp-state5')||'null'); if (s && Array.isArray(s.lgs)) { Object.assign(state, s); state.lab = { ...DEF.lab, ...(s.lab||{}) }; } } catch(e) {}
  const TABS = ['rankings','leagues','fearless','evidence','about'];
  const hashTab = (location.hash||'').replace('#','');
  if (TABS.includes(hashTab)) state.tab = hashTab; else if (hashTab==='method') state.tab = 'evidence';
  if (!TABS.includes(state.tab)) state.tab = state.tab==='method' ? 'evidence' : 'rankings';
  const save = () => { try { localStorage.setItem('fdp-state5', JSON.stringify(state)); } catch(e) {} };
  const ui = { q:'', all:false, labAll:false, open:new Set() };
  const filt = () => ({ lgs:new Set(state.lgs), st:state.st, pt:state.pt });
  // patch-notes adjustment: champion index -> strength multiplier (×1.25 per buff, ÷1.25 per nerf)
  const nmz = s => s.toLowerCase().replace(/[^a-z]/g,'');
  const cIdx = new Map(D.C.map((c,i)=>[nmz(c),i]));
  const ADJ = {}, ADJ_NOTES = {};
  PATCH.changes.forEach(([n,p,d,z]) => { const i = cIdx.get(nmz(n)); if (i===undefined) return; const sgn = d==='buff'?1:d==='nerf'?-1:0; ADJ[i] = (ADJ[i]||1)*Math.pow(PATCH.factor, sgn); (ADJ_NOTES[i] = ADJ_NOTES[i]||[]).push(`${p}: ${d} (${z})`); });

  // roles played this summer (Oracle's Elixir): champion index -> share per role
  const RL = ['Top','Jungle','Mid','Bot','Support'];
  const RSH = {}; D.C.forEach((c,i) => { const v = ROLES.counts[c]; if (!v) return; const n = v.reduce((a,b)=>a+b,0); if (n) RSH[i] = { sh:v.map(x=>x/n), n, main:v.indexOf(Math.max(...v)) }; });
  const roleLabel = c => { const r = RSH[c]; if (!r) return '–'; const o = r.sh.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]); return o[1][0] >= 0.15 ? `${RL[o[0][1]]} <span class="muted">/ ${RL[o[1][1]]}</span>` : RL[o[0][1]]; };
  const roleText = c => { const r = RSH[c]; if (!r) return 'No picks this summer'; return r.sh.map((s,i)=>[s,i]).filter(x=>x[0]>=0.02).sort((a,b)=>b[0]-a[0]).map(([s,i])=>`${RL[i]} ${Math.round(s*100)}%`).join(' · ') + ` (${r.n} picks)`; };
  if (state.role !== 'all' && !(state.role >= 0 && state.role <= 4)) state.role = 'all';
  $('seg-role').innerHTML = `<button data-v="all">All</button>` + RL.map((r,i)=>`<button data-v="${i}">${r}</button>`).join('');

  // ---------- controls ----------
  $('seg-lg').innerHTML = D.LG.map((n,i)=>`<button data-v="${i}">${n}</button>`).join('');
  const ptOrder = D.PT.map((p,i)=>[p,i]).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
  const LATEST = ptOrder[ptOrder.length-1];
  if (state.pt !== 'all' && state.pt !== LATEST[1]) state.pt = 'all';
  $('seg-pt').innerHTML = `<button data-v="all">All patches</button><button data-v="${LATEST[1]}">Latest only (${LATEST[0]})</button>`;
  { const md = Math.max(...P.games.map(g=>g.day)), dt = new Date(Date.UTC(2026,6,1+md));
    const mo = dt.toLocaleString('en-US',{month:'short',timeZone:'UTC'});
    $('dataline').textContent = `Data through ${mo} ${dt.getUTCDate()} · Oracle's Elixir · patches ${ptOrder[0][0]}–${LATEST[0]} · adjusted for ${PATCH.patches.join('–')}`; }
  function syncControls(){
    document.querySelectorAll('#seg-lg button').forEach(b=>b.setAttribute('aria-pressed', state.lgs.includes(+b.dataset.v)));
    document.querySelectorAll('#seg-st button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===String(state.st)));
    document.querySelectorAll('#seg-pt button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===String(state.pt)));
    document.querySelectorAll('#seg-role button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===String(state.role)));
    document.querySelectorAll('[role=tab]').forEach(b=>{ const on=b.dataset.tab===state.tab; b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1; $('p-'+b.dataset.tab).hidden = !on; });
    $('kn-half').value = state.half; $('kv-half').textContent = state.half + ' d';
  }

  // ---------- headline model (web worker, precomputed default) ----------
  let PL = null, L = null;            // PL: {champs,take,band,leagues}; L: local stats for current filter
  const key = () => JSON.stringify([state.lgs, String(state.st), String(state.pt), state.half, state.pmult]);
  const INIT_KEY = JSON.stringify([INIT.filt.lgs, 'all', 'all', INIT.cfg.half, INIT.cfg.pmult]);
  let worker = null, jobKey = null, wURL = null, bandN = 0;
  try {
    const src = $('engine').textContent + `
let WP = null;
onmessage = e => {
  const m = e.data;
  if (m.type === 'init') { WP = prepGames(m.D); return; }
  const f = { lgs:new Set(m.filt.lgs), st:m.filt.st, pt:m.filt.pt };
  const r = plRun(WP, f, m.cfg);
  const lg = plLeagues(WP, f, { half:m.cfg.half, pmult:m.cfg.pmult });
  postMessage({ type:'main', key:m.key, champs:r.champs, take:r.take, takeAdj:r.takeAdj, leagues:lg });
  if (r.champs.length) plBootstrap(WP, f, m.cfg, r, 40, (b, band) => postMessage({ type:'band', key:m.key, b, band }));
};`;
    wURL = URL.createObjectURL(new Blob([src], { type:'text/javascript' }));
  } catch(e) { wURL = null; }

  function setStatus(){
    const el = $('band-status');
    if (!PL) { el.className='status busy'; el.innerHTML='<i></i>Updating xPresence…'; return; }
    if (PL.band && bandN >= 40) { el.className='status done'; el.innerHTML='<i></i>Range from 40 resamples'; }
    else if (PL.band) { el.className='status busy'; el.innerHTML=`<i></i>Range: ${bandN} of 40 resamples`; }
    else { el.className='status busy'; el.innerHTML='<i></i>Computing range…'; }
  }
  function runPL(){
    const k = key();
    if (k === jobKey) return;
    jobKey = k;
    if (k === INIT_KEY) {
      if (worker) { worker.terminate(); worker = null; }
      PL = { champs:INIT.champs, take:INIT.take, takeAdj:INIT.takeAdj, band:INIT.band, leagues:INIT.leagues }; bandN = 40; renderAll(); return;
    }
    document.querySelectorAll('.panel').forEach(p=>p.classList.add('stale'));
    if (!wURL) { // fallback without a worker: no range
      setTimeout(() => { const r = plRun(P, filt(), { half:state.half, pmult:state.pmult, adj:ADJ }); PL = { champs:r.champs, take:r.take, takeAdj:r.takeAdj, band:null, leagues:plLeagues(P, filt(), { half:state.half, pmult:state.pmult }) }; bandN = 0; renderAll(); }, 30);
      return;
    }
    if (worker) worker.terminate();
    worker = new Worker(wURL);
    worker.onmessage = e => {
      const m = e.data; if (m.key !== jobKey) return;
      if (m.type === 'main') { PL = { champs:m.champs, take:m.take, takeAdj:m.takeAdj, band:null, leagues:m.leagues }; bandN = 0; renderAll(); }
      else if (m.type === 'band' && PL) { PL.band = m.band; bandN = m.b; renderRankings(); setStatus(); }
    };
    worker.postMessage({ type:'init', D });
    worker.postMessage({ type:'run', key:k, filt:{ lgs:state.lgs, st:state.st, pt:state.pt }, cfg:{ half:state.half, pmult:state.pmult, adj:ADJ } });
    setStatus();
  }

  // ---------- local stats (cheap) ----------
  const SLOT_GROUPS = [['Ban · phase 1',['ban1'],1],['Ban · phase 2',['ban2'],1],['FP1 (first pick)',['FP1']],['SP1–SP2',['SP1','SP2']],['FP2–FP3',['FP2','FP3']],['SP3',['SP3']],['SP4',['SP4']],['FP4–FP5',['FP4','FP5']],['SP5 (last pick)',['SP5']],['Pick, order unknown',['unknown']]];
  function localStats(){
    const games = filterGames(P, filt());
    const champs = PL.champs;
    const st = rawStats(games, champs), ctx = seriesContext(games, champs);
    const slots = new Map(champs.map(c=>[c,{}]));
    games.forEach(g => g.acts.forEach(a => { const s = slots.get(a.c); if (s) s[a.slot] = (s[a.slot]||0) + 1; }));
    const n = games.length;
    const golRank = new Map([...champs].sort((a,b)=>st.get(b).gol-st.get(a).gol).map((c,i)=>[c,i+1]));
    const idx = new Map(champs.map((c,i)=>[c,i]));
    const priRank = new Map([...champs].sort((a,b)=>PL.take[idx.get(b)]-PL.take[idx.get(a)]).map((c,i)=>[c,i+1]));
    const lgRank = PL.leagues.map(l => { const ix = l.champs.map((c,i)=>[c,l.take[i]]).sort((a,b)=>b[1]-a[1]); return { lg:l.lg, games:l.games, rank:new Map(ix.map(([c],i)=>[c,i+1])), take:new Map(ix) }; });
    const rows = champs.map((c,i) => { const s = st.get(c), x = ctx.get(c);
      return { c, name:name(c), take:PL.take[i], adj: PL.takeAdj ? PL.takeAdj[i] : null, chg: ADJ[c] ? (ADJ[c]>1?'up':ADJ[c]<1?'down':'adj') : (ADJ_NOTES[c]?'adj':null), band: PL.band ? PL.band[i] : null, pri:priRank.get(c), gol:golRank.get(c), gap:golRank.get(c)-priRank.get(c),
        p:s.p, b:s.b, wr: s.p ? s.w/s.p : null, g1: x.series ? x.g1/x.series : null, first: x.series ? x.sumFirst/x.series : null, nser:x.series, dec:x.pressurePicks }; });
    return { games, n, series:new Set(games.map(g=>g.sid)).size, rows, slots, lgRank, byC:new Map(rows.map(r=>[r.c,r])) };
  }

  // ---------- rankings ----------
  function renderSummary(){
    const rs = [...L.rows].sort((a,b)=>b.take-a.take);
    const top = rs[0];
    const mover = rs.slice(0,30).filter(r=>r.gap>0).sort((a,b)=>b.gap-a.gap)[0];
    const faller = rs.slice(0,30).filter(r=>r.gap<0).sort((a,b)=>a.gap-b.gap)[0];
    $('summary').innerHTML = `<div><span class="lab">Games</span><b>${L.n}</b></div><div><span class="lab">Series</span><b>${L.series}</b></div>
      ${top?`<div><span class="lab">Top xPresence</span><b class="nm">${top.name}</b><span class="num muted">${pct(top.take)}%</span></div>`:''}
      ${mover?`<div><span class="lab">gol.gg underrates</span><b class="nm">${mover.name}</b><span class="num muted">#${mover.pri} here, #${mover.gol} on gol.gg</span></div>`:''}
      ${faller?`<div><span class="lab">gol.gg overrates</span><b class="nm">${faller.name}</b><span class="num muted">#${faller.pri} here, #${faller.gol} on gol.gg</span></div>`:''}`;
  }
  function renderChart(){
    const top = [...L.rows].sort((a,b)=>b.take-a.take).slice(0,20);
    const W = 880, rowH = 25, padL = 112, padR = 118, padT = 24, H = padT + top.length*rowH + 6;
    const x = v => padL + (W-padL-padR) * v;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top 20 champions by xPresence with 80% ranges and gol.gg rank">`;
    for (let t=0; t<=1.0001; t+=0.2) {
      s += `<line x1="${x(t)}" x2="${x(t)}" y1="${padT-6}" y2="${H-4}" stroke="var(--line)"/>`;
      s += `<text x="${x(t)}" y="${padT-11}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--faint)">${Math.round(t*100)}%</text>`;
    }
    s += `<text x="${W-padR+30}" y="${padT-11}" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" letter-spacing=".06em" fill="var(--faint)">GOL.GG RANK</text>`;
    top.forEach((r,i) => {
      const y = padT + i*rowH, cy = y + rowH/2;
      s += `<text x="${padL-10}" y="${cy+4}" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="var(--ink)">${r.name}</text>`;
      if (r.band) s += `<rect x="${x(r.band[0])}" y="${y+3}" width="${Math.max(2, x(r.band[1])-x(r.band[0]))}" height="${rowH-6}" rx="3" fill="var(--accent-band)"/>`;
      s += `<rect x="${padL}" y="${cy-4}" width="${Math.max(1,x(r.take)-padL)}" height="8" rx="2" fill="var(--accent)"/>`;
      if (r.chg && r.adj != null && Math.abs(r.adj - r.take) > 0.002) s += `<path d="M${x(r.adj)} ${cy-7} L${x(r.adj)+5} ${cy} L${x(r.adj)} ${cy+7} L${x(r.adj)-5} ${cy} Z" fill="var(--mix)" stroke="var(--surface)" stroke-width="1"><title>${r.name}: ${pct(r.adj)}% after ${PATCH.patches.join('/')} changes</title></path>`;
      const lx = Math.max(x(r.take), r.band?x(r.band[1]):x(r.take)) + 6;
      s += lx > W-padR-4
        ? `<text x="${x(r.take)-6}" y="${cy+4}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11.5" font-weight="500" fill="var(--on-accent)" stroke="var(--accent)" stroke-width="3" paint-order="stroke">${pct(r.take)}</text>`
        : `<text x="${lx}" y="${cy+4}" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="var(--muted)">${pct(r.take)}</text>`;
      const col = r.gap>=3 ? 'var(--up)' : r.gap<=-3 ? 'var(--down)' : 'var(--faint)';
      const arrow = r.gap>=3 ? ' ▲' : r.gap<=-3 ? ' ▼' : '';
      s += `<text x="${W-padR+30}" y="${cy+4}" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="${col}">#${r.gol}${arrow}</text>`;
    });
    $('chart').innerHTML = s + '</svg>';
  }
  const RCOLS = [
    {k:'pri', t:'#', cls:'rk'}, {k:'name', t:'Champion', cls:'name'}, {k:'role', t:'Role', cls:'name', h2:'this summer'},
    {k:'take', t:'xPresence', h2:'fresh Game 1'}, {k:'adj', t:'Patch-adjusted', h2:PATCH.patches.join(', ')},
    {k:'gol', t:'gol.gg', h2:'rank'}, {k:'gap', t:'Gap', h2:'vs gol.gg'}, {k:'pb', t:'Picks / bans'},
  ];
  function detailHTML(r){
    const sl = L.slots.get(r.c) || {};
    const grp = SLOT_GROUPS.map(([lab, keys, ban]) => [lab, keys.reduce((a,k)=>a+(sl[k]||0),0), ban]).filter(g=>g[1]>0 || !g[0].includes('unknown'));
    const mx = Math.max(1, ...grp.map(g=>g[1]));
    const slots = grp.map(([lab,v,ban])=>`<div><span>${lab}</span><span class="sb ${ban?'ban':''}" style="width:${Math.round(100*v/mx)}%;min-width:${v?2:0}px"></span><span class="num">${v}</span></div>`).join('');
    const lg = L.lgRank.map(l => { const rk = l.rank.get(r.c); return `<span>${D.LG[l.lg]} <span class="muted">(${l.games} games)</span></span><span>${rk?`#${rk} · ${pct(l.take.get(r.c))}%`:'–'}</span>`; }).join('');
    return `<div class="dgrid">
      <div><h3>How it was drafted</h3><div class="slots">${slots}</div></div>
      <div><h3>Numbers</h3><div class="kv">
        <span>xPresence, 80% range</span><span>${r.band?`${pct(r.band[0],0)}–${pct(r.band[1],0)}%`:'…'}</span>
        <span>Picks · bans</span><span>${r.p} · ${r.b}</span>
        <span>Win rate when picked</span><span>${r.wr==null?'–':pct(r.wr,0)+'%'}</span></div>
        <p class="note" style="margin-top:6px">Roles this summer: ${roleText(r.c)}</p>
        <h3 style="margin-top:12px">Across a series</h3><div class="kv">
        <span>Series picked in</span><span>${r.nser}</span>
        <span>First picked in Game 1</span><span>${r.g1==null?'–':pct(r.g1,0)+'%'}</span>
        <span>Average first-pick game</span><span>${r.first==null?'–':r.first.toFixed(2)}</span>
        <span>Picks in deciding games</span><span>${r.dec}</span></div></div>
      <div><h3>Rank by league</h3><div class="kv">${lg}</div>
        <h3 style="margin-top:12px">Patch notes since this data</h3><p class="note">${ADJ_NOTES[r.c] ? ADJ_NOTES[r.c].join('; ') : 'No changes in ' + PATCH.patches.join(' or ') + '.'}</p></div></div>`;
  }
  function renderTable(){
    const thead = document.querySelector('#rank-tbl thead');
    thead.innerHTML = '<tr>' + RCOLS.map(c=>`<th tabindex="0" data-k="${c.k}" class="${c.cls||''}" ${state.sort===c.k?`aria-sort="${state.dir<0?'descending':'ascending'}"`:''}>${c.t}${c.h2?`<span class="h2">${c.h2}</span>`:''}</th>`).join('') + '</tr>';
    const q = ui.q.trim().toLowerCase();
    const ro = state.role === 'all' ? null : +state.role;
    let list = L.rows.filter(r => (!q || r.name.toLowerCase().includes(q)) && (ro === null || (RSH[r.c] && RSH[r.c].sh[ro] >= 0.15)));
    const rrank = new Map([...list].sort((a,b)=>b.take-a.take).map((r,i)=>[r.c,i+1]));
    if (!RCOLS.some(c=>c.k===state.sort)) { state.sort='take'; state.dir=-1; }
    const k = state.sort, val = r => k==='pb' ? r.p+r.b : k==='role' ? (RSH[r.c] ? RSH[r.c].main : 9) : k==='pri' && ro !== null ? rrank.get(r.c) : r[k];
    list.sort((a,b)=> k==='name' ? state.dir*a.name.localeCompare(b.name) : state.dir*((val(a)??-1)-(val(b)??-1)));
    const maxT = Math.max(...L.rows.map(r=>r.take));
    const shown = (ui.all || q) ? list : list.slice(0,40);
    document.querySelector('#rank-tbl tbody').innerHTML = shown.map(r => {
      const open = ui.open.has(r.c);
      const gapCls = r.gap>=3?'d-up':r.gap<=-3?'d-dn':'muted';
      return `<tr class="row" data-c="${r.c}" tabindex="0" aria-expanded="${open}">
        <td class="rk">${ro===null ? r.pri : rrank.get(r.c)}</td><td class="name">${r.name}</td><td class="rl">${roleLabel(r.c)}</td>
        <td class="pri"><span class="pbar" style="width:${Math.round(44*r.take/maxT)}px"></span>${pct(r.take)}%</td>
        <td class="${r.chg==='up'?'d-up':r.chg==='down'?'d-dn':'muted'}">${r.adj==null?'–':pct(r.adj)+'%'}${r.chg==='up'?' ▲':r.chg==='down'?' ▼':''}</td>
        <td>#${r.gol}</td><td class="${gapCls}">${r.gap>0?'+':''}${r.gap}</td>
        <td>${r.p} / ${r.b}</td></tr>` +
        (open ? `<tr class="detail"><td colspan="${RCOLS.length}">${detailHTML(r)}</td></tr>` : '');
    }).join('');
    $('more').parentElement.hidden = !!q || list.length <= 40;
    $('more').textContent = ui.all ? 'Show top 40' : `Show all ${list.length}`;
  }
  function renderRankings(){ if (!PL) return; L.rows.forEach((r,i)=>{ const j = PL.champs.indexOf(r.c); r.band = PL.band ? PL.band[j] : null; }); renderChart(); renderTable(); }

  // ---------- leagues heatmap ----------
  function renderHeat(){
    const top = [...L.rows].sort((a,b)=>b.take-a.take).slice(0,30);
    const hs = state.heatSort;
    if (hs !== 'all') { const lr = L.lgRank[+hs]; top.sort((a,b)=>(lr.rank.get(a.c)||999)-(lr.rank.get(b.c)||999)); }
    const head = `<thead><tr><th class="name" data-h="all" ${hs==='all'?'aria-sort="descending"':''}>Champion<span class="h2">overall rank</span></th>` +
      L.lgRank.map(l=>`<th data-h="${l.lg}" ${String(hs)===String(l.lg)?'aria-sort="ascending"':''}>${D.LG[l.lg]}<span class="h2">${l.games} games</span></th>`).join('') + '</tr></thead>';
    const body = top.map(r => `<tr><td class="name">${r.name} <span class="muted num" style="font-size:12px">#${r.pri}</span></td>` +
      L.lgRank.map(l => { const t = l.take.get(r.c), rk = l.rank.get(r.c);
        if (!rk) return `<td class="cell muted">–</td>`;
        const a = Math.round(Math.pow(t, 0.8) * 85);
        return `<td class="cell${rk<=5?' top5':''}" title="${r.name}: #${rk} in ${D.LG[l.lg]}, ${pct(t)}%" style="background:color-mix(in srgb, var(--accent) ${a}%, transparent);color:${a>48?'var(--on-accent)':'var(--ink)'}">${rk}</td>`; }).join('') + '</tr>').join('');
    $('heat').innerHTML = head + '<tbody>' + body + '</tbody>';
  }

  // ---------- fearless scatter ----------
  function renderScatter(){
    const pts = L.rows.filter(r => r.nser >= 15);
    const W = 880, H = 420, pl = 56, pr = 24, pt = 20, pb = 44;
    if (!pts.length) { $('scatter').innerHTML = '<p class="note">Not enough multi-game series in this filter.</p>'; return; }
    const yMax = Math.max(2.6, Math.ceil(Math.max(...pts.map(r=>r.first))*5)/5);
    const x = v => pl + (W-pl-pr) * v, y = v => pt + (H-pt-pb) * (v-1)/(yMax-1);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="xPresence against average game of first pick">`;

    $('roll-verdict').innerHTML = `<b>xPresence held up across ${ROLL.domTests + ROLL.intlTests} tests.</b> It beat gol.gg's PrioScore on ${h10.domBeats} of ${ROLL.domTests} patches in the six leagues (${f(h10.dom)} pooled) and on all ${ROLL.intlTests} international events (${f(h10.intl)}), across ${(ROLL.domActions+ROLL.intlActions).toLocaleString()} picks and bans from ${ROLL.games.toLocaleString()} games. A shorter half-life does a little better: 5 days gives ${f(h5.dom)} and ${f(h5.intl)}, and makes the percentages accurate at international events without any other correction, so xPresence switched to 5 days on Sep 26.`;
    $('roll-half').innerHTML = `<thead><tr><th>Half-life</th><th>Domestic<span class="h2">${ROLL.domTests} patches</span></th><th>Beats gol.gg</th><th>International<span class="h2">${ROLL.intlTests} events</span></th><th>Beats gol.gg</th></tr></thead><tbody>` +
      H.map(x=>`<tr class="${x.h===5?'hl':''}"><td>${x.h? x.h+' days' : 'No recency'}${x.h===5?' (current)':x.h===10?' (until Sep 26)':''}</td><td class="num">${f(x.dom)}</td><td class="num">${x.domBeats}/${ROLL.domTests}</td><td class="num">${f(x.intl)}</td><td class="num">${x.intlBeats}/${ROLL.intlTests}</td></tr>`).join('') + '</tbody>';
    const e = ROLL.extra, c = ROLL.cal;
    $('roll-notes').innerHTML = [
      `Recency is almost the whole edge. Without it, xPresence scores ${f(h0.dom)} domestic and ${f(h0.intl)} international, about the same as gol.gg.`,
      `The hand-weighted score with 10-day recency trails xPresence: ${f(e.base_rec10[0][0])} domestic, ${f(e.base_rec10[1][0])} international.`,
      `Deciding-game weighting has no measurable effect (${f(e.dec[0][0])} with it, ${f(e.nodec[0][0])} without, domestic).`,
      `Confidence: at 10 days, xPresence's percentages are right for domestic play but slightly too high for international events (best-fit scale ${c[10].international} vs 1.00 = accurate). At 5 days they're accurate for international events (${c[5].international}) and slightly too cautious domestically (${c[5].domestic}).`,
      `The only domestic patch where xPresence lost was 16.3 (early 2026, after the season-start changes).`,
      `The patch-notes adjustment was tested separately; see below.`
    ].map(t=>`<li>${t}</li>`).join('');
    const T = ROLL.tests, rowH = 17, W = 880, padL = 96, padR = 60, gap = 22;
    const dom = T.filter(t=>t.kind==='domestic'), intl = T.filter(t=>t.kind==='international');
    const all = dom.concat([null]).concat(intl);
    const lo = Math.min(-0.1, ...T.map(t=>Math.min(t.h10,t.h5))), hi = Math.max(...T.map(t=>Math.max(t.h10,t.h5)));
    const x = v => padL + (W-padL-padR) * (v-lo)/(hi-lo);
    const H2 = 40 + all.length*rowH + gap;
    let s2 = `<svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="xPresence versus gol.gg in every rolling test">`;
    for (let t = Math.ceil(lo*10)/10; t <= hi+1e-9; t += 0.1) s2 += `<line x1="${x(t)}" x2="${x(t)}" y1="18" y2="${H2-4}" stroke="${Math.abs(t)<1e-9?'var(--muted)':'var(--line)'}"/><text x="${x(t)}" y="12" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="var(--faint)">${t>0?'+':''}${Math.round(t*100)}%</text>`;
    let y = 38;
    all.forEach(t => {
      if (!t) { y += gap - rowH; s2 += `<text x="4" y="${y+10}" font-family="IBM Plex Sans Condensed, sans-serif" font-size="10.5" letter-spacing=".06em" fill="var(--faint)">INTERNATIONAL</text>`; y += rowH; return; }
      const cy = y + rowH/2;
      s2 += `<text x="${padL-8}" y="${cy+4}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink)">${t.label}</text>`;
      s2 += `<rect x="${Math.min(x(0),x(t.h10))}" y="${cy-4}" width="${Math.max(1,Math.abs(x(t.h10)-x(0)))}" height="8" rx="2" fill="${t.h10>=0?'var(--accent)':'var(--down)'}"><title>${t.label}: ${f(t.h10)} at 10 days, ${f(t.h5)} at 5 days (${t.test} games)</title></rect>`;
      s2 += `<circle cx="${x(t.h5)}" cy="${cy}" r="3.2" fill="var(--mix)"/>`;
      s2 += `<text x="${W-padR+6}" y="${cy+4}" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="var(--muted)">${f(t.h10)}</text>`;
      y += rowH;
    });
    s2 += `<text x="4" y="33" font-family="IBM Plex Sans Condensed, sans-serif" font-size="10.5" letter-spacing=".06em" fill="var(--faint)">PATCHES</text>`;
    $('roll-chart').innerHTML = s2 + '</svg>';
  }
  function renderMSI(){
    const x = MSI.rows[0], f = v => (v>=0?'+':'')+(v*100).toFixed(1)+'%';
    $('msi-verdict').innerHTML = `<b>xPresence passed.</b> Built from ${MSI.train} spring games (patches 16.6–16.11), it found MSI's real picks and bans ${(x.vsGol*100).toFixed(1)}% more likely than gol.gg's PrioScore did (90% range ${(x.lo*100).toFixed(0)}–${(x.hi*100).toFixed(0)}%), the best of ${MSI.rows.length} models. MSI was played on 16.13, two patches past the training data, which is the same kind of gap Worlds will have. Nearly all of the edge comes from recency: without it, the same models tie or trail gol.gg.`;
    const mx = Math.max(...MSI.rows.map(r=>Math.abs(r.vsGol)));
    const cell = v => `<span class="bbar" style="width:${Math.round(56*Math.abs(v)/mx)}px;background:${v>=0?'var(--up)':'var(--down)'}"></span>${f(v)}`;
    $('msi-bt').innerHTML = `<thead><tr><th>Model</th><th>vs gol.gg at MSI<span class="h2">per draft action</span></th><th>90% range<span class="h2">resampling MSI series</span></th><th>Rank corr.<span class="h2">with MSI weighted score</span></th></tr></thead><tbody>` +
      MSI.rows.map(r => `<tr class="${r.name.startsWith('xPresence as')?'hl':''}"><td>${r.name}</td><td class="num">${cell(r.vsGol)}</td><td class="num muted">${r.name.startsWith('gol.gg')?'–':f(r.lo)+' to '+f(r.hi)}</td><td class="num">${r.rho.toFixed(3)}</td></tr>`).join('') + '</tbody>';
    $('msi-pred').innerHTML = MSI.pred.predTop.map((r,i)=>`<span>${i+1}. ${r.n} <span class="muted">(${pct(r.x,0)}%)</span></span><span class="${r.msiRank<=10?'d-up':'muted'}">#${r.msiRank} at MSI</span>`).join('');
    $('msi-act').innerHTML = MSI.pred.actualTop.map((r,i)=>`<span>${i+1}. ${r.n} <span class="muted">(${pct(r.msi,0)}% presence)</span></span><span class="${r.xRank<=10?'d-up':r.xRank>20?'d-dn':'muted'}">#${r.xRank} going in</span>`).join('');
    $('msi-note').textContent = `Test: ${MSI.test} MSI games in ${MSI.series} series (${MSI.actions.toLocaleString()} picks and bans). ${MSI.pred.hitTop10} of xPresence's top 10 finished in MSI's top 10. The big misses, Poppy (#57 going in, #4 at MSI) and Camille (#70 going in, #12 at MSI), barely appeared in the spring data, which is what a patch change looks like. Rank correlations are close for every model; the differences are in how confidently each one called the top picks. Training used every spring split and playoff from the six leagues (${MSI.train} games). All data here comes from Oracle's Elixir, and fearless held in every series. The 10-day half-life was chosen on summer data before this test, so this result is out of sample.`;
  }
  function renderSnap(){
    const e = Object.entries(SNAP.champs);
    $('snap-pl').innerHTML = e.slice(0,10).map(([n,v])=>`<li>${n}<span>${pct(v.plTake)}%</span></li>`).join('');
    $('snap-mix').innerHTML = [...e].sort((a,b)=>b[1].plTakeAdj-a[1].plTakeAdj).slice(0,10).map(([n,v])=>`<li>${n}<span>${pct(v.plTakeAdj)}%</span></li>`).join('');
  }

  // ---------- orchestration ----------
  function renderAll(){
    syncControls(); setStatus();
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('stale'));
    if (!PL) return;
    L = localStats();
    renderSummary(); renderRankings(); renderHeat(); renderScatter();
    if ($('d-archive').open) renderLab();
    save();
  }
  function changed(){ syncControls(); save(); runPL(); }
  let tmr; const soon = fn => { clearTimeout(tmr); tmr = setTimeout(fn, 220); };

  document.querySelectorAll('#seg-lg button').forEach(b=>b.addEventListener('click',()=>{ const v=+b.dataset.v, has=state.lgs.includes(v); if (has && state.lgs.length===1) return; state.lgs = has ? state.lgs.filter(x=>x!==v) : [...state.lgs, v].sort(); changed(); }));
  $('lg-all').addEventListener('click',()=>{ state.lgs=[0,1,2,3,4,5]; changed(); });
  document.querySelectorAll('#seg-st button').forEach(b=>b.addEventListener('click',()=>{ state.st=b.dataset.v; changed(); }));
  document.querySelectorAll('#seg-pt button').forEach(b=>b.addEventListener('click',()=>{ state.pt=b.dataset.v==='all'?'all':+b.dataset.v; changed(); }));
  document.querySelectorAll('[role=tab]').forEach(b=>b.addEventListener('click',()=>{ state.tab=b.dataset.tab; syncControls(); save(); try { history.replaceState(null,'','#'+state.tab); } catch(e) {} }));
  document.querySelector('[role=tablist]').addEventListener('keydown', e => { if (e.key!=='ArrowRight' && e.key!=='ArrowLeft') return; const tabs=[...document.querySelectorAll('[role=tab]')]; const i=tabs.findIndex(t=>t.dataset.tab===state.tab); const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length]; n.click(); n.focus(); });
  $('kn-half').addEventListener('input', e => { state.half = +e.target.value; $('kv-half').textContent = state.half+' d'; soon(changed); });
  $('reset-pl').addEventListener('click', () => { state.half = DEF.half; changed(); });
  $('q').addEventListener('input', e => { ui.q = e.target.value; renderTable(); });
  document.querySelectorAll('#seg-role button').forEach(b=>b.addEventListener('click',()=>{ state.role = b.dataset.v==='all' ? 'all' : +b.dataset.v; syncControls(); renderTable(); save(); }));
  $('more').addEventListener('click', () => { ui.all = !ui.all; renderTable(); });
  const rankSort = th => { const k = th.dataset.k; if (state.sort===k) state.dir*=-1; else { state.sort=k; state.dir = ['name','pri','gol','role'].includes(k)?1:-1; } renderTable(); save(); };
  document.querySelector('#rank-tbl thead').addEventListener('click', e => { const th=e.target.closest('th'); if (th) rankSort(th); });
  document.querySelector('#rank-tbl thead').addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { const th=e.target.closest('th'); if (th) { e.preventDefault(); rankSort(th); } } });
  const toggleRow = tr => { const c = +tr.dataset.c; ui.open.has(c) ? ui.open.delete(c) : ui.open.add(c); renderTable(); const again = document.querySelector(`#rank-tbl tr.row[data-c="${c}"]`); if (again) again.focus(); };
  document.querySelector('#rank-tbl tbody').addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (tr) toggleRow(tr); });
  document.querySelector('#rank-tbl tbody').addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { const tr = e.target.closest('tr.row'); if (tr) { e.preventDefault(); toggleRow(tr); } } });
  $('heat').addEventListener('click', e => { const th = e.target.closest('th'); if (!th) return; state.heatSort = th.dataset.h; renderHeat(); save(); });
  ADD.filter(a => !a.retired).forEach(a => { $('use-'+a.id).addEventListener('change', e => { state.lab[a.key] = e.target.checked; renderLab(); save(); });
    if (a.knob) $('kn-'+a.knob.id).addEventListener('input', e => { state.lab[a.knob.id] = +e.target.value; $('kv-'+a.knob.id).textContent = state.lab[a.knob.id]; soon(()=>{ renderLab(); save(); }); }); });
  $('lab-more').addEventListener('click', () => { ui.labAll = !ui.labAll; renderLab(); });
  document.querySelector('#lab-tbl thead').addEventListener('click', e => { const th=e.target.closest('th'); if (!th) return; const k=th.dataset.k; if (state.lab.sort===k) state.lab.dir*=-1; else { state.lab.sort=k; state.lab.dir=(k==='name'||k==='rk')?1:-1; } renderLab(); save(); });

  $('d-archive').addEventListener('toggle', () => { if ($('d-archive').open && L) renderLab(); });
  $('res-tbl').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (!b) return; const d = $(b.dataset.open); d.open = true; d.scrollIntoView({ behavior:'smooth', block:'start' }); });
  renderResults(); renderRoles(); renderCalib(); renderBacktest(); renderPatchAdj(); renderRolling(); renderMSI(); renderSnap(); syncControls(); runPL();
})();
</script>
